<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniDeploy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b0d10;
            color: #f4f4f5;
        }

        .container {
            width: min(1100px, calc(100% - 40px));
            margin: 0 auto;
            padding: 48px 0;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: -1px;
        }

        .subtitle {
            margin-top: 8px;
            color: #9ca3af;
        }

        .panel {
            background: #15181d;
            border: 1px solid #272b33;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 32px;
        }

        .deploy-form {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            background: #0f1115;
            border: 1px solid #303640;
            color: white;
            border-radius: 9px;
            padding: 13px 14px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #71717a;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .primary {
            background: white;
            color: #111;
        }

        .secondary {
            background: #272b33;
            color: white;
        }

        .danger {
            background: #3a1719;
            color: #fca5a5;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title h2 {
            font-size: 20px;
            margin: 0;
        }

        .deployment {
            background: #15181d;
            border: 1px solid #272b33;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 14px;
        }

        .deployment-top {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .app-name {
            font-size: 18px;
            font-weight: 700;
        }

        .repo {
            margin-top: 6px;
            font-size: 13px;
            color: #9ca3af;
            word-break: break-all;
        }

        .meta {
            margin-top: 16px;
            display: flex;
            gap: 20px;
            color: #a1a1aa;
            font-size: 13px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            height: 26px;
            padding: 0 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .running {
            color: #86efac;
            background: #12321f;
        }

        .stopped,
        .missing {
            color: #fca5a5;
            background: #3a1719;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        .empty {
            text-align: center;
            color: #71717a;
            padding: 50px 20px;
            border: 1px dashed #303640;
            border-radius: 14px;
        }

        #message {
            margin-top: 12px;
            font-size: 13px;
            color: #a1a1aa;
        }

        .logs-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .logs-modal {
            width: min(900px, 100%);
            max-height: 80vh;
            overflow: hidden;
            background: #111317;
            border: 1px solid #303640;
            border-radius: 14px;
        }

        .logs-header {
            padding: 16px 18px;
            border-bottom: 1px solid #272b33;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        pre {
            margin: 0;
            padding: 18px;
            overflow: auto;
            max-height: 65vh;
            color: #d4d4d8;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {
            .deploy-form {
                flex-direction: column;
            }

            .deployment-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <h1>MiniDeploy</h1>
        <div class="subtitle">
            Self-hosted application deployments on mini-server
        </div>
    </header>

    <div class="panel">
        <div class="deploy-form">
            <input
                id="repoUrl"
                type="text"
                placeholder="https://github.com/user/project.git"
            >
            <button class="primary" onclick="deployApp()">
                Deploy
            </button>
        </div>

        <div id="message"></div>
    </div>

    <div class="section-title">
        <h2>Deployments</h2>
        <button class="secondary" onclick="loadDeployments()">
            Refresh
        </button>
    </div>

    <div id="deployments"></div>
</div>

<div class="logs-overlay" id="logsOverlay">
    <div class="logs-modal">
        <div class="logs-header">
            <strong id="logsTitle">Logs</strong>

            <button class="secondary" onclick="closeLogs()">
                Close
            </button>
        </div>

        <pre id="logsContent"></pre>
    </div>
</div>

<script>
async function loadDeployments() {
    const container = document.getElementById("deployments");

    try {
        const response = await fetch("/deployments");
        const deployments = await response.json();

        if (!deployments.length) {
            container.innerHTML =
                '<div class="empty">No deployments yet.</div>';
            return;
        }

        container.innerHTML = deployments.map(app => `
            <div class="deployment">

                <div class="deployment-top">
                    <div>
                        <div class="app-name">
                            ${escapeHtml(app.app)}
                        </div>

                        <div class="repo">
                            ${escapeHtml(app.repoUrl)}
                        </div>
                    </div>

                    <span class="status ${app.status}">
                        ${escapeHtml(app.status.toUpperCase())}
                    </span>
                </div>

                <div class="meta">
                    <span>Port ${app.port}</span>
                    <span>${escapeHtml(app.container)}</span>
                </div>

                <div class="actions">
                    <button
                        class="secondary"
                        onclick="openApp(${app.port})"
                    >
                        Open
                    </button>

                    <button
                        class="secondary"
                        onclick="showLogs('${escapeJS(app.app)}')"
                    >
                        Logs
                    </button>

                    <button
                        class="secondary"
                        onclick="restartApp('${escapeJS(app.app)}')"
                    >
                        Restart
                    </button>

                    <button
                        class="secondary"
                        onclick="redeployApp('${escapeJS(app.app)}')"
                    >
                        Redeploy
                    </button>

                    <button
                        class="danger"
                        onclick="deleteApp('${escapeJS(app.app)}')"
                    >
                        Delete
                    </button>
                </div>
            </div>
        `).join("");

    } catch (error) {
        container.innerHTML =
            '<div class="empty">Failed to load deployments.</div>';
    }
}

async function deployApp() {
    const input = document.getElementById("repoUrl");
    const message = document.getElementById("message");

    const repoUrl = input.value.trim();

    if (!repoUrl) {
        message.textContent = "Enter a Git repository URL.";
        return;
    }

    message.textContent = "Deploying...";

    try {
        const response = await fetch("/deploy", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ repoUrl })
        });

        if (!response.ok) {
            throw new Error(await response.text());
        }

        const deployment = await response.json();

        message.textContent =
            `${deployment.app} deployed on port ${deployment.port}.`;

        input.value = "";

        await loadDeployments();

    } catch (error) {
        message.textContent =
            `Deployment failed: ${error.message}`;
    }
}

function openApp(app) {
    window.open(
        `http://mini-server.local/${encodeURIComponent(app)}/`,
        "_blank"
    );
}

async function showLogs(app) {
    const response = await fetch(
        `/deployments/${encodeURIComponent(app)}/logs`
    );

    if (!response.ok) {
        alert("Failed to retrieve logs.");
        return;
    }

    const result = await response.json();

    document.getElementById("logsTitle").textContent =
        `${app} logs`;

    document.getElementById("logsContent").textContent =
        result.logs || "No logs available.";

    document.getElementById("logsOverlay").style.display =
        "flex";
}

function closeLogs() {
    document.getElementById("logsOverlay").style.display =
        "none";
}

async function restartApp(app) {
    await runAction(
        `/deployments/${encodeURIComponent(app)}/restart`,
        "POST",
        `${app} restarted.`
    );
}

async function redeployApp(app) {
    await runAction(
        `/deployments/${encodeURIComponent(app)}/redeploy`,
        "POST",
        `${app} redeployed.`
    );
}

async function deleteApp(app) {
    if (!confirm(`Delete ${app}?`)) {
        return;
    }

    await runAction(
        `/deployments/${encodeURIComponent(app)}`,
        "DELETE",
        `${app} deleted.`
    );
}

async function runAction(url, method, successMessage) {
    const message = document.getElementById("message");

    message.textContent = "Working...";

    try {
        const response = await fetch(url, { method });

        if (!response.ok) {
            throw new Error(await response.text());
        }

        message.textContent = successMessage;

        await loadDeployments();

    } catch (error) {
        message.textContent =
            `Operation failed: ${error.message}`;
    }
}

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

function escapeJS(value) {
    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}

loadDeployments();
</script>

</body>
</html>
